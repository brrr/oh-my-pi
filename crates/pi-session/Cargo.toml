# Pure-Rust session store for the headless omp control plane (WP-1.3). Reads and
# writes the v3 JSONL session journal (`packages/coding-agent/src/session/`) and
# rebuilds the read-only LLM message view (`build_session_context`) byte-parity
# with the TS `loadSessionMessagesReadOnly`. No N-API: pure-core crate guarded by
# `scripts/check-pure-core-no-napi.sh`.
#
# Scope: reads v1/v2/v3 (WP-1.6 B4 migration in memory), resolves blob:sha256
# refs (B5), and streams files ≥8MiB (B6). Transcript-mode context stays deferred.
[package]
name = "pi-session"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
base64.workspace = true
pi-ai.workspace = true

